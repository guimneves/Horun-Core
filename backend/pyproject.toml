[project]
name = "horun-core"
version = "0.1.0"
description = "Horun Core — login unico, cadastro de modulos, permissoes e gateway da plataforma Horun"
requires-python = ">=3.11"
# Versão exata, não faixa aberta (">=") — o Dockerfile não usa lockfile
# (`pip install ".[postgres]"` puro), então todo `docker compose up
# --build` reinstala do zero com o que houver de mais novo no PyPI
# naquele instante. Isso já quebrou produção sem aviso (SQLModel mudou o
# padrão de datetime pra exigir timezone, derrubando reserva/agenda/RUE,
# que sempre guardaram hora local ingênua de propósito — ver NaiveDatetime
# em app/db/models.py). Trave aqui, teste, só então suba a versão.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlmodel==0.0.47",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic==2.13.4",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "apscheduler==3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# Fase 2: driver do PostgreSQL — só necessário na imagem Docker do
# servidor, não no desenvolvimento local (SQLite embutido no Python).
postgres = [
    "psycopg[binary]==3.3.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
